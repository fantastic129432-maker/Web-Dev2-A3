$kind: http-request
name: PUT /events/9999  (no such event)  -> 404
description: >-
  EXPECTED TO FAIL with 404. An update of an event that does not exist is a missing
  resource, not a bad request: the body is perfectly valid and the id is a valid
  shape. The message says there was nothing to update, which is the distinction the
  status code is making.
url: "{{baseUrl}}/events/9999"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "capacity": 10
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      const body = pm.response.json();

      pm.test('the message names the id and says nothing was updated', () => {
        pm.expect(body.error.message).to.contain('9999');
        pm.expect(body.error.message).to.contain('nothing to update');
      });
    language: text/javascript
order: 7000