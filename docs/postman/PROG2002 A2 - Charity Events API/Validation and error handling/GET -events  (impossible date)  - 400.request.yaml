$kind: http-request
name: /events  (impossible date)  -> 400
description: EXPECTED TO FAIL with 400. Shows that a date is checked as a real calendar date, not merely as text in the right shape.
url: "{{baseUrl}}/events?from=2026-13-45"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: from
    value: 2026-13-45
    description: Month 13, day 45.
scripts:
  - type: afterResponse
    code: pm.test('status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
