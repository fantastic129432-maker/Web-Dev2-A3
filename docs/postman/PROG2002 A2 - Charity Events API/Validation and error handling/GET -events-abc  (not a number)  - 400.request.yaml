$kind: http-request
name: /events/abc  (not a number)  -> 400
description: EXPECTED TO FAIL with 400. The id must be a positive whole number.
url: "{{baseUrl}}/events/abc"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test('status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
