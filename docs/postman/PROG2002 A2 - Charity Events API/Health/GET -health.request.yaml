$kind: http-request
name: /health
description: Returns the API status and the database connection details. A 503 means the API is running but MySQL is unreachable.
url: "{{baseUrl}}/health"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('envelope reports success', () => pm.expect(pm.response.json().success).to.be.true);
      pm.test('database is connected', () => pm.expect(pm.response.json().data.database.connected).to.not.eql(false));
    language: text/javascript
order: 1000
