$kind: http-request
name: /events  (three criteria at once)
description: This is the request to demonstrate in the video. It filters on date, location and category together and returns exactly one event, the Riverside Rainbow Fun Run. The meta.appliedFilters object echoes what was applied.
url: "{{baseUrl}}/events?state=all&city=Lismore&category=1&from=2026-01-01&to=2026-12-31"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: state
    value: all
    description: Include events that have already finished.
  - key: city
    value: Lismore
    description: Partial, case-insensitive city match.
  - key: category
    value: "1"
    description: Category id 1 is Fun Run. Repeat the key or use commas for several.
  - key: from
    value: 2026-01-01
    description: Earliest end date.
  - key: to
    value: 2026-12-31
    description: Latest start date.
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('exactly one event matches', () => pm.expect(body.meta.total).to.eql(1));
      pm.test('the match is the Lismore fun run', () => {
        pm.expect(body.data[0].eventId).to.eql(1);
      });
      pm.test('the applied filters are echoed back', () => {
        pm.expect(body.meta.appliedFilters.city).to.eql('Lismore');
        pm.expect(body.meta.appliedFilters.categoryIds).to.eql([1]);
      });
      pm.test('the progress figures are present', () => {
        const event = body.data[0];
        pm.expect(event.goalAmount).to.be.a('number');
        pm.expect(event.raisedAmount).to.be.a('number');
        pm.expect(event.progressPercent).to.be.a('number');
      });
    language: text/javascript
order: 2000
