$kind: http-request
name: /events  (several categories)
description: Shows that a repeated query parameter is treated as a list. The same result comes from category=1,2.
url: "{{baseUrl}}/events?state=all&category=1&category=2&limit=100"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: state
    value: all
  - key: category
    value: "1"
    description: Fun Run. Repeating the parameter is how the search page sends a multi-select.
  - key: category
    value: "2"
    description: Gala Dinner.
  - key: limit
    value: "100"
scripts:
  - type: afterResponse
    code: |-
      pm.test('only the requested categories are returned', () => {
        pm.response.json().data.forEach((event) => pm.expect([1, 2]).to.include(event.categoryId));
      });
    language: text/javascript
order: 3000
