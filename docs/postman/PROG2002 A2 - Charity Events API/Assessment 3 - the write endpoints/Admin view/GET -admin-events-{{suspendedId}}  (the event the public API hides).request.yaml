$kind: http-request
name: GET /admin/events/{{suspendedId}}  (the event the public API hides)
description: >-
  The same URL the folder "Validation and error handling" proves answers 404 on the
  public path, read through the admin path instead. A 200 here and a 404 there is the
  single clearest demonstration that the visibility rule is a property of the view
  the endpoint reads, not of the page that called it.
url: "{{baseUrl}}/admin/events/{{suspendedId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200 for the suspended event', () => pm.response.to.have.status(200));
      const body = pm.response.json();

      pm.test('the admin view is identified in the meta', () => {
        pm.expect(body.meta.view).to.eql('admin');
      });

      pm.test('the event the public API hides is returned in full', () => {
        pm.expect(String(body.data.eventId)).to.eql(pm.collectionVariables.get('suspendedId'));
        pm.expect(body.data.status).to.eql('suspended');
      });

      pm.test('the admin detail carries the same fields as the public detail', () => {
        pm.expect(body.data.ticketTypes).to.be.an('array');
        pm.expect(body.data.registrations).to.be.an('array');
        pm.expect(body.data.registrationCount).to.be.a('number');
      });
    language: text/javascript
order: 6320