$kind: http-request
name: DELETE /events/{{allocationEventId}}  (204, tidy up)
description: >-
  Removes the small event again, so the folder can be run repeatedly and leaves nothing
  behind. It is also a second, independent demonstration of the delete rule from the
  other side: no registration was ever recorded against this event - the one attempt
  was refused - so the delete succeeds immediately with a 204.
url: "{{baseUrl}}/events/{{allocationEventId}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 204 No Content', () => pm.response.to.have.status(204));
      pm.test('the deleted event is the one this folder created', () => {
        pm.expect(pm.response.headers.get('X-Deleted-Event-Id'))
          .to.eql(pm.collectionVariables.get('allocationEventId'));
      });
    language: text/javascript
order: 6430
