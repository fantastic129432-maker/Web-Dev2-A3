$kind: http-request
name: 'POST /events  (a small event for the allocation check)'
description: >-
  Sets up the event the next request needs: one tier with a single place, so asking for
  more than one ticket must be refused. It is deliberately kept out of the main
  create request so that the event the rest of the collection works on stays the
  realistic one from the documentation, and it is deleted again at the end of this
  folder.
url: "{{baseUrl}}/events"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "organizationId": 1,
      "categoryId": 1,
      "locationId": 6,
      "eventName": "Postman A3 Allocation Check {{postmanRunId}}",
      "shortDescription": "One tier with a single place, to test the allocation rule.",
      "description": "This event exists only so that the ticket allocation rule can be tested against a tier that really has almost nothing left.",
      "purpose": "Prove that a registration cannot exceed what is left of a tier.",
      "eventDate": "2026-12-05",
      "startTime": "07:00",
      "endTime": "09:00",
      "goalAmount": 0,
      "isFree": true,
      "capacity": 1,
      "status": "active",
      "imageUrl": "fun-run.svg",
      "ticketTypes": [
        { "ticketName": "Last place", "price": 25, "quantityAvailable": 1 }
      ]
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201 for a created event', () => pm.response.to.have.status(201));
      const event = pm.response.json().data;

      pm.test('the tier has a single place, which is what the next request tests', () => {
        pm.expect(event.ticketTypes.length).to.eql(1);
        pm.expect(event.ticketTypes[0].quantityAvailable).to.eql(1);
      });

      pm.collectionVariables.set('allocationEventId', String(event.eventId));
      pm.collectionVariables.set('allocationTicketTypeId', String(event.ticketTypes[0].ticketTypeId));
    language: text/javascript
order: 6410
