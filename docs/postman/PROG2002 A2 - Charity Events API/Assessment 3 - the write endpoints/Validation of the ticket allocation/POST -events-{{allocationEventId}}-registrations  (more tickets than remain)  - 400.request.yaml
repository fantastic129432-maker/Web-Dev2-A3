$kind: http-request
name: POST /events/{{allocationEventId}}/registrations  (more than remain)  -> 400
description: >-
  EXPECTED TO FAIL with 400. The tier has one place and the request asks for the
  largest quantity a single registration may contain, so the API counts what is left
  and refuses. error.details carries the remaining number and the tier name as extra
  keys beside field and message, which is what lets the form say "choose 1 or fewer"
  rather than merely "invalid" - and it is the same error.details shape the form
  already handles for a plain field failure.
url: "{{baseUrl}}/events/{{allocationEventId}}/registrations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "attendeeName": "Too Many Tickets",
      "attendeeEmail": "postman.a3.too.many.{{postmanRunId}}@example.com",
      "ticketTypeId": {{allocationTicketTypeId}},
      "ticketsPurchased": 20
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400));
      const body = pm.response.json();

      pm.test('the quantity is named as the field that was wrong', () => {
        pm.expect(body.error.details.some((entry) => entry.field === 'ticketsPurchased')).to.be.true;
      });

      pm.test('the remaining allocation is reported, not just refused', () => {
        const entry = body.error.details.find((row) => row.field === 'ticketsPurchased');
        pm.expect(entry.remaining).to.be.a('number');
        pm.expect(entry.ticketName).to.be.a('string');
        pm.expect(body.error.message).to.contain('remain');
      });

      pm.test('the count that is reported is the one place the tier had', () => {
        const entry = body.error.details.find((row) => row.field === 'ticketsPurchased');
        pm.expect(entry.remaining).to.eql(1);
      });
    language: text/javascript
order: 6420
