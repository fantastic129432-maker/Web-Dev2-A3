$kind: http-request
name: 'POST /events  (create, and save the id)'
description: >-
  Creates the event the rest of this folder works on and stores the new id in the
  collection variable newEventId, so every later request addresses the event this run
  created rather than a seeded one. The pre-request script settles one run id that the
  event name and the attendee email are both built from, which is what keeps the
  collection re-runnable: the name is always new and the email never collides with the
  unique key on (event_id, attendee_email).
url: "{{baseUrl}}/events"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "organizationId": 1,
      "categoryId": 8,
      "locationId": 6,
      "eventName": "Postman A3 Trivia Night {{postmanRunId}}",
      "shortDescription": "Ten rounds, six people a table, all for the youth program.",
      "description": "A relaxed trivia night at Lismore City Hall with a licensed bar, a raffle and a prize for the best team name.",
      "purpose": "Fund the after-school homework club for 40 students.",
      "eventDate": "2026-11-14",
      "startTime": "18:30",
      "endTime": "22:00",
      "goalAmount": 8000,
      "isFree": false,
      "capacity": 180,
      "status": "active",
      "imageUrl": "community.svg",
      "ticketTypes": [
        { "ticketName": "Table of six", "price": 60, "quantityAvailable": 30, "description": "One table, six players" },
        { "ticketName": "Single seat", "price": 12, "quantityAvailable": null, "description": "We will place you in a team" }
      ]
    }
  options:
    raw:
      language: json
scripts:
  - type: beforeRequest
    code: |-
      // One run id for the whole run. The event name and the attendee email are
      // both built from it, so a second run of the collection cannot collide with
      // the event the first run created, nor with the unique key on
      // (event_id, attendee_email). The collection variable is set here because
      // the request body is rendered after the pre-request script runs.
      pm.collectionVariables.set('postmanRunId', String(Date.now()));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 201 for a created event', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('the envelope reports the creation', () => pm.expect(body.meta.created).to.be.true);

      pm.test('the Location header points at the new event', () => {
        const location = pm.response.headers.get('Location');
        pm.expect(location).to.match(/^\/api\/events\/\d+$/);
      });

      pm.test('the created event is returned with its id', () => {
        pm.expect(body.data.eventId).to.be.a('number');
        pm.expect(body.data.eventName).to.contain(pm.collectionVariables.get('postmanRunId'));
      });

      pm.test('the ticket tiers were created with the event', () => {
        pm.expect(body.data.ticketTypes).to.be.an('array');
        pm.expect(body.data.ticketTypes.length).to.eql(2);
      });

      pm.test('a new event starts with no registrations', () => {
        pm.expect(body.data.registrationCount).to.eql(0);
        pm.expect(body.data.ticketsSold).to.eql(0);
      });

      // The two ids every later request needs. Ownership of an event in this
      // collection is the id, so it is kept in a variable rather than typed in.
      pm.collectionVariables.set('newEventId', String(body.data.eventId));
      pm.collectionVariables.set('newTicketTypeId', String(body.data.ticketTypes[0].ticketTypeId));
    language: text/javascript
order: 6110