$kind: http-request
name: PUT /events/{{newEventId}}  (empty body)  -> 400
description: >-
  EXPECTED TO FAIL with 400. An empty body is refused rather than treated as "nothing
  to do", because it is far more likely to be a client bug - a form that posted the
  wrong object, say - and a silent 200 would hide it. The refusal has no details
  array, which is the difference from a field-by-field failure: there was no field to
  object to.
url: "{{baseUrl}}/events/{{newEventId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400));
      const body = pm.response.json();

      pm.test('the message tells the client what to send instead', () => {
        pm.expect(body.error.message).to.contain('No fields were supplied');
      });

      pm.test('the refusal carries no per-field details', () => {
        // A field-by-field failure lists every problem; this one had no field to
        // object to, so there is nothing to iterate over.
        pm.expect(body.error.details).to.be.undefined;
      });
    language: text/javascript
order: 6140