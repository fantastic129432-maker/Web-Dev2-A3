$kind: http-request
name: PUT /events/{{newEventId}}  (partial update, two fields)
description: >-
  A partial update: only the fields in the body are validated and changed, so the
  admin form can send exactly what a member of staff edited. The other fields of
  the event are left alone, which the assertions check by looking at a field that
  was not sent.
url: "{{baseUrl}}/events/{{newEventId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "goalAmount": 9000,
      "capacity": 200
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200 for an updated event', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('the envelope reports the update', () => pm.expect(body.meta.updated).to.be.true);

      pm.test('the event is still the one that was created', () => {
        pm.expect(body.data.eventId).to.eql(Number(pm.collectionVariables.get('newEventId')));
      });

      pm.test('both supplied fields were changed', () => {
        pm.expect(body.data.goalAmount).to.eql(9000);
        pm.expect(body.data.capacity).to.eql(200);
      });

      pm.test('a field that was not sent is untouched', () => {
        pm.expect(body.data.eventName).to.contain(pm.collectionVariables.get('postmanRunId'));
        pm.expect(body.data.eventDate).to.eql('2026-11-14');
      });
    language: text/javascript
order: 6120