$kind: http-request
name: POST /events/{{newEventId}}/registrations  (duplicate email)  -> 409
description: >-
  EXPECTED TO FAIL with 409. The brief's rule is that a user may register for multiple
  events but can only register for an event once, and this is the request that proves
  it. It uses exactly the email the request above registered with, so the collision is
  deliberate rather than accidental: a fixed address would instead make the working
  request fail on the second run of the collection.
url: "{{baseUrl}}/events/{{newEventId}}/registrations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "attendeeName": "Priya Raman",
      "attendeeEmail": "postman.a3.{{postmanRunId}}@example.com",
      "ticketsPurchased": 1,
      "ticketTypeId": {{newTicketTypeId}}
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 409 Conflict', () => pm.response.to.have.status(409));
      const body = pm.response.json();
      pm.test('the envelope reports failure', () => pm.expect(body.success).to.be.false);

      pm.test('the email is named as the field that clashed', () => {
        pm.expect(body.error.details.field).to.eql('attendeeEmail');
        pm.expect(body.error.details.attendeeEmail)
          .to.eql(`postman.a3.${pm.collectionVariables.get('postmanRunId')}@example.com`);
      });

      pm.test('the message says the rule that was broken', () => {
        pm.expect(body.error.message).to.contain('has already registered');
      });
    language: text/javascript
order: 6220