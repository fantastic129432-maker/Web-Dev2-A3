$kind: http-request
name: PUT /registrations/{{registrationId}}  (partial update)
description: >-
  The same partial-update rule as PUT /api/events/:id, with one addition worth
  showing: an explicit empty string clears an optional field. The phone number is
  emptied here, so the response carries attendeePhone as null and the stored row is
  read back in the same shape.
url: "{{baseUrl}}/registrations/{{registrationId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "ticketsPurchased": 3,
      "attendeePhone": ""
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200 for an updated registration', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('the envelope reports the update', () => pm.expect(body.meta.updated).to.be.true);

      pm.test('the field that was sent was changed', () => {
        pm.expect(body.data.ticketsPurchased).to.eql(3);
      });

      pm.test('an empty string clears the optional phone number', () => {
        pm.expect(body.data.attendeePhone).to.be.null;
      });

      pm.test('the total is recalculated from the stored tier price', () => {
        pm.expect(body.data.totalAmount).to.eql(body.data.ticketPrice * 3);
      });

      pm.test('a field that was not sent is untouched', () => {
        pm.expect(body.data.attendeeName).to.eql('Priya Raman');
      });
    language: text/javascript
order: 6260