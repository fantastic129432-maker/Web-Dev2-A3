$kind: http-request
name: 'POST /events/{{newEventId}}/registrations  (register, and save the id)'
description: >-
  Registers an attendee for the event this run created, and stores the new id in the
  collection variable registrationId. The attendee email is built from the run id the
  create request settled, so a second run of the folder never collides with the unique
  key on (event_id, attendee_email) - that collision is what the duplicate request in
  the folder "Validation and error handling" tests on purpose.
url: "{{baseUrl}}/events/{{newEventId}}/registrations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  mode: raw
  raw: |-
    {
      "attendeeName": "Priya Raman",
      "attendeeEmail": "postman.a3.{{postmanRunId}}@example.com",
      "attendeePhone": "0412 555 019",
      "ticketTypeId": {{newTicketTypeId}},
      "ticketsPurchased": 2,
      "registeredAt": "2026-10-01",
      "notes": "One adult and one child."
    }
  options:
    raw:
      language: json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201 for a created registration', () => pm.response.to.have.status(201));
      const body = pm.response.json();

      pm.test('the Location header points at the new registration', () => {
        pm.expect(pm.response.headers.get('Location')).to.match(/^\/api\/registrations\/\d+$/);
      });

      pm.test('the registration is stored against the event that was created', () => {
        pm.expect(body.data.eventId).to.eql(Number(pm.collectionVariables.get('newEventId')));
        pm.expect(body.data.attendeeEmail)
          .to.eql(`postman.a3.${pm.collectionVariables.get('postmanRunId')}@example.com`);
      });

      pm.test('the tier price is used to work out the total', () => {
        pm.expect(body.data.totalAmount).to.eql(body.data.ticketPrice * body.data.ticketsPurchased);
      });

      pm.collectionVariables.set('registrationId', String(body.data.registrationId));
    language: text/javascript
order: 6210