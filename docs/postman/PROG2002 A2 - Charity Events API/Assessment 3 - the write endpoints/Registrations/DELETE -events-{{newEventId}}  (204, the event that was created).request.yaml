$kind: http-request
name: DELETE /events/{{newEventId}}  (204, the event that was created)
description: >-
  The other half of the delete rule, and the last request of the collection. The
  request before it - also in the folder "Registrations" - removed the registration, so
  the same URL that answered 409 while the registration existed answers 204 now, and the
  run leaves the database as it found it. A 204 carries no body, so the outcome is
  repeated in the X-Deleted-Event-Id and X-Deleted-Event-Name headers, which is what
  makes the result visible in Postman.
url: "{{baseUrl}}/events/{{newEventId}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 204 No Content', () => pm.response.to.have.status(204));
      pm.test('there is no response body', () => pm.expect(pm.response.text()).to.eql(''));

      pm.test('the deleted event is named in the headers', () => {
        pm.expect(pm.response.headers.get('X-Deleted-Event-Id'))
          .to.eql(pm.collectionVariables.get('newEventId'));
        pm.expect(decodeURIComponent(pm.response.headers.get('X-Deleted-Event-Name')))
          .to.contain(pm.collectionVariables.get('postmanRunId'));
      });
    language: text/javascript
order: 6290