$kind: http-request
name: GET /registrations/{{registrationId}}  (one registration)
description: >-
  One registration on its own URL, in the same shape as an element of the list. This
  is what a receipt page or an "edit registration" screen loads before it shows the
  form.
url: "{{baseUrl}}/registrations/{{registrationId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();

      pm.test('the read returns the registration this run created', () => {
        pm.expect(body.data.registrationId).to.eql(Number(pm.collectionVariables.get('registrationId')));
        pm.expect(body.data.eventId).to.eql(Number(pm.collectionVariables.get('newEventId')));
      });

      pm.test('the contact details are the ones that were submitted', () => {
        pm.expect(body.data.attendeeName).to.eql('Priya Raman');
        pm.expect(body.data.attendeeEmail)
          .to.eql(`postman.a3.${pm.collectionVariables.get('postmanRunId')}@example.com`);
      });

      pm.test('the stored total is the tier price times the tickets', () => {
        pm.expect(body.data.totalAmount).to.eql(body.data.ticketPrice * body.data.ticketsPurchased);
      });

      pm.test('the registeredAt date that was sent is the one on record', () => {
        // "2026-10-01" was submitted; a date without a time becomes midday.
        pm.expect(body.data.registeredAt).to.eql('2026-10-01 12:00:00');
      });
    language: text/javascript
order: 6250