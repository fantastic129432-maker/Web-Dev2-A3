<!--
  Language and theme controls, shared by the header on every page.

  Markup follows the legacy js/nav.js buildSettingsBar() exactly, so the 52 kB
  shared stylesheet styles it without any component CSS beyond the one rule that
  lets the settings bar wrap onto its own line inside the header.
-->
<div class="settings-bar">
  <!-- Language: every supported language, each shown in its own script. -->
  <div class="settings-bar__group">
    <label class="settings-bar__label" for="language-select">
      {{ 'settings.language' | t }}:
    </label>
    <select
      class="language-select"
      id="language-select"
      #languageSelect
      [attr.aria-label]="'settings.languageLabel' | t"
      [value]="language()"
      (change)="setLanguage(languageSelect.value)"
    >
      @for (entry of languages; track entry.code) {
        <!--
          [selected] matters, and is not a duplicate of the [value] above.
          The options are created by this loop, so on the FIRST render the select's
          value is assigned before any option exists and the assignment is dropped:
          the browser then displays the first option, so a visitor whose browser
          asks for Chinese saw the interface in Chinese with the picker reading
          "English". Marking the option itself selected fixes the first paint;
          [value] on the select keeps the element's value correct afterwards.
        -->
        <option [value]="entry.code" [selected]="entry.code === language()">
          {{ entry.nativeLabel }}
        </option>
      }
    </select>
  </div>

  <!-- Theme: one button that cycles light -> dark -> system. -->
  <div class="settings-bar__group">
    <button
      class="theme-toggle"
      type="button"
      id="theme-toggle"
      [attr.aria-label]="themeAriaLabel()"
      (click)="cycleTheme()"
    >
      <span class="theme-toggle__icon" aria-hidden="true">{{ icon() }}</span>
      <span>{{ themeLabel() }}</span>
    </button>
  </div>

  <!--
    Only shown while a language other than English is active: the event names,
    descriptions and venue names come from the database in English, so the
    visitor is told that switching language translates the interface only.
  -->
  @if (!isEnglish) {
    <p class="settings-note">{{ 'settings.interfaceOnly' | t }}</p>
  }
</div>
