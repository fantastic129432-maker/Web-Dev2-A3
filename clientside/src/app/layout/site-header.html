<!--
  The HEADER segment, identical on every page: the brand, the mobile menu button and
  the settings controls. The NAV segment is rendered inside it, by app-site-nav, so
  the menu belongs to the header landmark - that is what the shell's "Header
  (contains Nav)" comment in app.html refers to.

  The heart-in-a-circle mark is inline SVG rather than a file: it is four lines of
  path data, it inherits the brand colour from CSS, and it cannot 404. The legacy
  header did the same.
-->
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/" [attr.aria-label]="'a11y.orgHome' | t: { name: ('nav.siteName' | t) }">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="34" height="34" role="presentation">
          <circle cx="16" cy="16" r="15" fill="#0f7b6c"></circle>
          <path
            d="M16 25s-7.4-4.6-9.3-9.1C5.2 12.3 7.4 8.6 11 8.6c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.6 0 5.8 3.7 4.3 7.3C23.4 20.4 16 25 16 25z"
            fill="#ffffff"
          ></path>
        </svg>
      </span>
      <span class="brand__text">
        <strong>{{ 'nav.siteName' | t }}</strong>
        <small>{{ 'nav.tagline' | t }}</small>
      </span>
    </a>

    <!--
      The mobile menu button. It stays in the header rather than moving into the nav
      component because this is the position the layout gives it - between the brand
      and the controls. Hidden above 760px by the stylesheet; below that it reveals
      `.site-nav` by making the nav component put `.site-nav--open` on it.
      aria-expanded is kept in step with the signal so assistive technology knows the
      state, and aria-controls still names the id the nav element carries.
    -->
    <button
      class="site-nav__toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ 'nav.toggle' | t }}</span>
      <span aria-hidden="true">&#9776;</span>
    </button>

    <div class="site-header__nav">
      <app-settings-bar />

      <!--
        NAV segment (2 of the 4 in app.html). `showNav` decides whether the menu is
        rendered at all; `menuOpen` is the class the mobile stylesheet keys off;
        `linkActivated` closes the menu after a navigation.
      -->
      <app-site-nav
        [showNav]="showNav()"
        [menuOpen]="menuOpen()"
        (linkActivated)="closeMenu()"
      />
    </div>
  </div>
</header>
