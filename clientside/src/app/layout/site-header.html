<!--
  The HEADER segment, identical on every page: the brand, the mobile menu button and
  the settings controls. The NAV segment is rendered inside it, by app-site-nav, so
  the menu belongs to the header landmark - that is what the shell's "Header
  (contains Nav)" comment in app.html refers to.

  ONE ROW ON DESKTOP
  Brand, menu and settings controls are three flex items of `.site-header__inner`.
  Above 760px the stylesheet keeps them on one line, centred against the logo; the
  menu and the settings controls share the right-hand wrapper so the two of them
  are laid out as a single group and the menu can sit against the controls rather
  than floating in the middle of the bar. Below 760px that wrapper becomes a
  column, which is what puts the settings controls under the collapsed menu.

  The heart-in-a-circle mark is inline SVG rather than a file: it is four lines of
  path data, it inherits the brand colour from CSS, and it cannot 404. The legacy
  header did the same.
-->
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/" [attr.aria-label]="'a11y.orgHome' | t: { name: ('nav.siteName' | t) }">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="34" height="34" role="presentation">
          <circle cx="16" cy="16" r="15" fill="#0f7b6c"></circle>
          <path
            d="M16 25s-7.4-4.6-9.3-9.1C5.2 12.3 7.4 8.6 11 8.6c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.6 0 5.8 3.7 4.3 7.3C23.4 20.4 16 25 16 25z"
            fill="#ffffff"
          ></path>
        </svg>
      </span>
      <span class="brand__text">
        <strong>{{ 'nav.siteName' | t }}</strong>
        <small>{{ 'nav.tagline' | t }}</small>
      </span>
    </a>

    <!--
      The mobile menu button. It stays in the header rather than moving into the nav
      component because this is the position the layout gives it - between the brand
      and the controls. Hidden above 760px by the stylesheet; below that it reveals
      `.site-nav` by making the nav component put `.site-nav--open` on it.
      aria-expanded is kept in step with the signal so assistive technology knows the
      state, and aria-controls still names the id the nav element carries.
    -->
    <button
      class="site-nav__toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ 'nav.toggle' | t }}</span>
      <span aria-hidden="true">&#9776;</span>
    </button>

    <div class="site-header__nav">
      <!--
        The menu is listed BEFORE the settings controls. On desktop the single row
        reads brand | Home Search Events Admin site | Language Theme, with the
        controls pushed to the far edge; on a narrow screen this wrapper is a
        column and the menu then sits above the controls, which is the reading
        order the mobile stylesheet was written for.
      -->
      <app-site-nav
        [showNav]="showNav()"
        [menuOpen]="menuOpen()"
        (linkActivated)="closeMenu()"
      />

      <!--
        The divider between the two groups. What sits on either side answers a
        different question - "where can I go?" (Home, Search Events, Admin site)
        against "how should this site look?" (language, theme) - and until now the
        row read as one long run of controls with the language picker immediately
        after "Admin site". The rule is a real, styled element (it is 1px of
        `--line`, the same token as every other border in the header) rather than a
        `|` typed into the markup, so it follows the theme and can be hidden.

        It is rendered only when the menu is: on the wildcard 404 route `showNav` is
        false, and a rule with nothing on its left would be exactly the stray
        separator an earlier review went looking for. Below 760px it is hidden by
        the stylesheet, where the row becomes a column and a vertical rule between
        two stacked groups would separate nothing.
      -->
      @if (showNav()) {
        <span class="site-header__divider" aria-hidden="true"></span>
      }

      <div class="site-header__controls">
        <app-settings-bar />
      </div>
    </div>
  </div>
</header>
