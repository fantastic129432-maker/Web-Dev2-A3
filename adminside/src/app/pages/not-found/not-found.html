     NOT FOUND (ADMIN)
     The wildcard route: a mistyped or stale admin URL, with one link
     back to the dashboard.
     ================================================================== -->

  <h3>{{ 'notFound.heading' | t }}</h3>
  <p>{{ 'notFound.lead' | t }}</p>

    <a class="button" routerLink="/">{{ 'notFound.back' | t }}</a>
  </p>
</div>
