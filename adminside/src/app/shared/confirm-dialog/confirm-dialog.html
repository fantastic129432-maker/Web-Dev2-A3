<!-- ==================================================================
     CONFIRM DIALOG
     The shared "are you sure?" step. The parent renders it only while
     something is pending, and Cancel holds the focus.
     ================================================================== -->

<!-- The Tab trap is a document-level host listener on the component, because a
     keydown only bubbles through its own ancestors and the trap has to recover the
     focus after it has escaped to the body; see onKeydown() in confirm-dialog.ts. -->
<div class="confirm-backdrop" (click)="onBackdrop($event)">
  <div #panel class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 class="confirm-panel__title" id="confirm-title">{{ titleKey() | t }}</h2>
    <p class="confirm-panel__body">{{ bodyKey() | t: bodyValues() }}</p>
    <!-- The optional consequence line. It is rendered only when the parent supplies
         a key, so a caller with nothing extra to say gets the same two-paragraph
         dialog it had before; see detailKey in confirm-dialog.ts for why the
         registrations page needs this as text of its own. -->
    @if (detailKey()) {
      <p class="confirm-panel__detail">{{ detailKey() | t: detailValues() }}</p>
    }

    <div class="confirm-panel__actions">
      <!--
        Cancel comes first in the DOM and receives the focus, so the safe choice
        is both the one a keyboard lands on and the one Tab reaches first.
      -->
      <button
        #cancelButton
        class="button button--outline"
        type="button"
        (click)="cancelled.emit()"
      >
        {{ cancelLabelKey() | t }}
      </button>
      <button
        class="button button--danger"
        type="button"
        [disabled]="busy()"
        (click)="confirmed.emit()"
      >
        {{ confirmLabelKey() | t }}
      </button>
    </div>
  </div>
</div>
